<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Asawa 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Dancing Script',cursive;}
body{background:linear-gradient(135deg,#3d2b00,#6b4c00,#8a6500,#6b4c00);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.sunflower{position:fixed;pointer-events:none;font-size:24px;animation:fall linear infinite;top:-60px;}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
.container{text-align:center;background:rgba(255,220,50,.1);backdrop-filter:blur(15px);padding:40px;border-radius:20px;box-shadow:0 15px 30px rgba(0,0,0,.4);border:1px solid rgba(255,220,50,.3);z-index:10;position:relative;}
h1{color:#FFD700;margin-bottom:20px;font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.5);}
button{margin:10px;padding:14px 25px;border:none;border-radius:30px;background:#c8860a;color:#fff9e0;cursor:pointer;font-size:1.1rem;font-family:'Dancing Script',cursive;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.3);}
button:hover{transform:scale(1.1);background:#e09b00;}
.overlay{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:100;}
.popup-content{width:360px;background:linear-gradient(160deg,#fffbe0,#fff3b0);padding:28px;border-radius:20px;text-align:center;animation:pop .4s ease;border:2px solid #FFD700;}
@keyframes pop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.popup-content img{width:100%;border-radius:15px;margin-bottom:15px;}
.popup-content h2{color:#8a5c00;font-size:1.5rem;margin-bottom:10px;}
.popup-content p{color:#4a3500;font-size:1.1rem;line-height:1.7;min-height:80px;}
.close-btn{background:#c8860a;color:#fff9e0;margin-top:15px;border:none;border-radius:30px;padding:10px 22px;font-family:'Dancing Script',cursive;font-size:1rem;cursor:pointer;transition:.3s;}
.close-btn:hover{background:#e09b00;transform:scale(1.05);}
#music-toggle{position:fixed;top:15px;right:15px;background:rgba(255,215,0,.2);border:1px solid rgba(255,215,0,.5);color:#FFD700;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;transition:.3s;}
#music-toggle:hover{background:rgba(255,215,0,.35);}
.cursor{display:inline-block;width:2px;height:1.1em;background:#4a3500;vertical-align:middle;animation:blink .7s step-end infinite;margin-left:1px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
</style>
</head>
<body>

<button id="music-toggle" title="Toggle music">🎵</button>

<audio id="bg-music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1>🌻 For My Favorite Person 🌻</h1>
  <button onclick="showMessage(0)">💛 Why I Love You</button>
  <button onclick="showMessage(1)">🌹 Special Memory</button>
  <button onclick="showMessage(2)">💌 A Letter</button>
  <button onclick="showMessage(3)">✨ Future Together</button>
</div>

<div class="overlay" id="popup">
  <div class="popup-content">
    <img id="popupImage" src="" alt="">
    <h2 id="popupTitle"></h2>
    <p id="popupMessage"></p>
    <button class="close-btn" onclick="closePopup()">Close 🌻</button>
  </div>
</div>

<script>
const data=[
{title:"Why I Love You 💛",image:"IMG_1636.jpg",message:"Your smile brightens my darkest moments, and being with you is my favorite place in the world. You make me happy in ways you don't know. None of these words can easily describe how much Iloveyou asawa ko."},
{title:"Our Special Memory 🌹",image:"IMG_1111.jpg",message:"Every memory we've shared is a treasure. I replay them in my heart because every moment with you is unforgettable."},
{title:"A Letter For You 💌",image:"IMG_0853.jpg",message:"Thank you for loving me, believing in me, and making life beautiful. I promise to cherish you today, tomorrow, and always. Iloveyousomuch asawa ko na mapamakyu HAHAHAHA."},
{title:"Our Future Together ✨",image:"IMG_1242.jpg",message:"I dream of countless adventures, laughter, hugs, sunsets, and forever with you. You're my favorite chapter, and I can't wait for the rest of our story. Mahal na mahal kita asawa koooo."}
];

for(let i=0;i<25;i++){
  let s=document.createElement("div");
  s.className="sunflower";
  s.innerHTML="🌻";
  s.style.left=Math.random()*100+"%";
  s.style.fontSize=(14+Math.random()*22)+"px";
  s.style.animationDuration=(6+Math.random()*8)+"s";
  s.style.animationDelay=Math.random()*8+"s";
  document.body.appendChild(s);
}

let musicPlaying=false;
const audio=document.getElementById("bg-music");
const btn=document.getElementById("music-toggle");

document.addEventListener("click",function startMusic(){
  if(!musicPlaying){
    audio.volume=0.4;
    audio.play().then(()=>{musicPlaying=true;btn.textContent="🔊";}).catch(()=>{});
    document.removeEventListener("click",startMusic);
  }
},true);

btn.addEventListener("click",function(e){
  e.stopPropagation();
  if(musicPlaying){audio.pause();musicPlaying=false;btn.textContent="🔇";}
  else{audio.play();musicPlaying=true;btn.textContent="🔊";}
});

function typewriter(el,text,speed=35){
  el.innerHTML="";
  let i=0;
  let cursor=document.createElement("span");
  cursor.className="cursor";
  el.appendChild(cursor);
  function type(){
    if(i<text.length){
      el.insertBefore(document.createTextNode(text[i]),cursor);
      i++;
      setTimeout(type,speed);
    } else {
      cursor.remove();
    }
  }
  type();
}

function showMessage(index){
  const d=data[index];
  document.getElementById("popupImage").src=d.image;
  document.getElementById("popupTitle").textContent=d.title;
  document.getElementById("popupMessage").textContent="";
  document.getElementById("popup").style.display="flex";
  setTimeout(()=>typewriter(document.getElementById("popupMessage"),d.message),300);
}

function closePopup(){document.getElementById("popup").style.display="none";}

window.onclick=function(e){if(e.target===document.getElementById("popup"))closePopup();};
</script>
</body>
</html>
